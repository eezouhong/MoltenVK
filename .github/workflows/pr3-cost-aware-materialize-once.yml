name: PR3 source fix once

on:
  push:
    branches:
      - codex/shared-shader-library-repository-phase1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0
      - name: Apply lock-order-safe trim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mm = Path('MoltenVK/MoltenVK/GPUObjects/MVKShaderModule.mm')
          text = mm.read_text()
          start = text.index('void MVKShaderLibraryRepository::trimToResidentLimit(')
          end = text.index('\nMVKShaderLibrary* MVKShaderLibraryRepository::acquire(', start)
          body = text[start:end]
          if 'vector<MVKShaderLibrary*> retainedLibraries;' not in body:
              old_loop = '''\tvector<Candidate> candidates;
\t{
\t\tlock_guard<mutex> lock(_lock);
\t\tfor (auto& moduleEntries : _entries) {
\t\t\tfor (Entry& entry : moduleEntries.second) {
\t\t\t\tMVKShaderLibrary* library = entry.library;
\t\t\t\tif (library == protectedLibrary ||
\t\t\t\t\t!library->isResident() ||
\t\t\t\t\t!library->_repositoryResidentCounted.load(memory_order_acquire)) {
\t\t\t\t\tcontinue;
\t\t\t\t}

\t\t\t\tMVKShaderLibraryEvictionSnapshot snapshot;
\t\t\t\tif (!library->tryGetEvictionSnapshot(snapshot)) { continue; }
\t\t\t\tif (currentUseSequence < snapshot.rehydrateProtectedUntilSequence) {
\t\t\t\t\t_rehydrateProtectionSkipCount.fetch_add(1, memory_order_relaxed);
\t\t\t\t\tcontinue;
\t\t\t\t}

\t\t\t\tuint64_t coldness = currentUseSequence >= snapshot.lastUseSequence
\t\t\t\t\t? currentUseSequence - snapshot.lastUseSequence
\t\t\t\t\t: 0;
\t\t\t\tuint64_t benefitPages = min<uint64_t>(
\t\t\t\t\tsnapshot.reclaimableUncompressedMSLBytes / 4096,
\t\t\t\t\t65535);
\t\t\t\tuint64_t rehydrateCost = snapshot.lastRehydrateNanoseconds;
\t\t\t\tif (rehydrateCost == 0) {
\t\t\t\t\trehydrateCost = kUnknownRehydrateCostNanoseconds;
\t\t\t\t\t_unknownRehydrateCostCandidateCount.fetch_add(1, memory_order_relaxed);
\t\t\t\t}
\t\t\t\tuint64_t costMicros = min<uint64_t>(rehydrateCost / 1000, 65535);
\t\t\t\tuint64_t score =
\t\t\t\t\t(min<uint64_t>(coldness, 65535) * 4) +
\t\t\t\t\t(benefitPages * 2) +
\t\t\t\t\t(65535 - costMicros);

\t\t\t\tlibrary->retain();
\t\t\t\tcandidates.push_back({ score, snapshot, library });
\t\t\t}
\t\t}
\t}
'''
              new_loop = '''\tvector<MVKShaderLibrary*> retainedLibraries;
\t{
\t\tlock_guard<mutex> lock(_lock);
\t\tfor (auto& moduleEntries : _entries) {
\t\t\tfor (Entry& entry : moduleEntries.second) {
\t\t\t\tMVKShaderLibrary* library = entry.library;
\t\t\t\tif (library == protectedLibrary ||
\t\t\t\t\t!library->isResident() ||
\t\t\t\t\t!library->_repositoryResidentCounted.load(memory_order_acquire)) {
\t\t\t\t\tcontinue;
\t\t\t\t}
\t\t\t\tlibrary->retain();
\t\t\t\tretainedLibraries.push_back(library);
\t\t\t}
\t\t}
\t}

\tvector<Candidate> candidates;
\tcandidates.reserve(retainedLibraries.size());
\tfor (MVKShaderLibrary* library : retainedLibraries) {
\t\tMVKShaderLibraryEvictionSnapshot snapshot;
\t\tif (!library->tryGetEvictionSnapshot(snapshot)) { continue; }
\t\tif (currentUseSequence < snapshot.rehydrateProtectedUntilSequence) {
\t\t\t_rehydrateProtectionSkipCount.fetch_add(1, memory_order_relaxed);
\t\t\tcontinue;
\t\t}
\t\tuint64_t coldness = currentUseSequence >= snapshot.lastUseSequence
\t\t\t? currentUseSequence - snapshot.lastUseSequence : 0;
\t\tuint64_t benefitPages = min<uint64_t>(snapshot.reclaimableUncompressedMSLBytes / 4096, 65535);
\t\tuint64_t rehydrateCost = snapshot.lastRehydrateNanoseconds;
\t\tif (rehydrateCost == 0) {
\t\t\trehydrateCost = kUnknownRehydrateCostNanoseconds;
\t\t\t_unknownRehydrateCostCandidateCount.fetch_add(1, memory_order_relaxed);
\t\t}
\t\tuint64_t costMicros = min<uint64_t>(rehydrateCost / 1000, 65535);
\t\tuint64_t score = (min<uint64_t>(coldness, 65535) * 4) + (benefitPages * 2) + (65535 - costMicros);
\t\tcandidates.push_back({ score, snapshot, library });
\t}
'''
              if old_loop not in body:
                  raise SystemExit('expected cost-aware trim body not found')
              body = body.replace(old_loop, new_loop, 1)
              body = body.replace(
                  'for (const Candidate& candidate : candidates) { candidate.library->release(); }',
                  'for (MVKShaderLibrary* library : retainedLibraries) { library->release(); }',
                  1)
              mm.write_text(text[:start] + body + text[end:])

          test = Path('Scripts/test-metal4-shared-shader-repository.py')
          t = test.read_text()
          marker = '    assert "tryGetEvictionSnapshot(snapshot)" in trim_body\n'
          if marker in t and 'retained_collect = trim_body.index' not in t:
              t = t.replace(marker, marker + '    retained_collect = trim_body.index("retainedLibraries.push_back(library)")\n    snapshot_call = trim_body.index("tryGetEvictionSnapshot(snapshot)")\n    assert retained_collect < snapshot_call\n', 1)
              test.write_text(t)
          PY
          python3 Scripts/test-metal4-shared-shader-repository.py
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git add MoltenVK Scripts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(metal4): avoid repository shader-library lock inversion'
          git pull --rebase origin codex/shared-shader-library-repository-phase1
          git push origin HEAD:codex/shared-shader-library-repository-phase1
