name: Apply Metal 4 Lifetime Safety Fix

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/bootstrap-metal4-lifetime-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed safety patch
        run: |
          set -euo pipefail
          echo "72d8f106bbc207bc7b30b50b84aa9b6ffd4f6d1dd85f88793b1186a85d96ab98  .github/bootstrap/metal4-lifetime-safety.patch" | sha256sum --check
          git apply --check .github/bootstrap/metal4-lifetime-safety.patch
          git apply --index .github/bootstrap/metal4-lifetime-safety.patch

      - name: Run independent gates
        run: |
          set -euo pipefail
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --cached --check

      - name: Commit source-only fix
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/metal4-lifetime-safety.patch
          rmdir .github/bootstrap 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): preserve in-flight command lifetimes"
          git push origin HEAD:metal4/phase1-command-backend-poc
