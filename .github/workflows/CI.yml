name: CI

# Keep push and pull-request executions independent while a one-shot source fix
# is being committed. The workflow restores this file before pushing the fix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validation-residency-fix:
    if: github.event_name == 'push' && github.ref_name == 'metal4/phase1-command-backend-poc' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply the validation-only public residency probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin metal4/phase1-command-backend-poc
          current="$(git rev-parse origin/metal4/phase1-command-backend-poc)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced from $GITHUB_SHA to $current; a newer CI run will apply the fix." >&2
            exit 1
          fi
          git reset --hard "$current"

          python3 - <<'PY'
          from pathlib import Path

          queue_path = Path("MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm")
          source = queue_path.read_text()
          marker = "Metal 4 validation override will probe the public residency-set factory"
          if marker not in source:
              old = '''\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
'''
              new = '''\tif (!getMetalFeatures().residencySets && !validationOverride) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 validation override will probe the public residency-set factory despite the missing capability advertisement.");
\t}
'''
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one residency capability gate, found {source.count(old)}")
              queue_path.write_text(source.replace(old, new, 1))

          contract_path = Path("Scripts/test-metal4-command-backend-phase1.py")
          contract = contract_path.read_text()
          contract_marker = "production residency capability gate can be bypassed"
          if contract_marker not in contract:
              anchor = '''    require(queue_mm, r"mvkOSVersionIsAtLeast\\(\\s*26\\.0\\s*\\)", "OS 26 gate is missing")
'''
              addition = anchor + '''    require(
        queue_mm,
        r"!getMetalFeatures\\(\\)\\.residencySets\\s*&&\\s*!validationOverride",
        "production residency capability gate can be bypassed without the private validation override",
    )
    require(
        queue_mm,
        r"validation override will probe the public residency-set factory",
        "validation cannot test the real public residency factory when feature advertisement is incomplete",
    )
'''
              if contract.count(anchor) != 1:
                  raise SystemExit(f"expected one source-contract anchor, found {contract.count(anchor)}")
              contract_path.write_text(contract.replace(anchor, addition, 1))
          PY

          rm -f .github/workflows/fix-metal4-validation-residency.yml
          git show "$GITHUB_SHA^:.github/workflows/CI.yml" > .github/workflows/CI.yml
          git show "$GITHUB_SHA~3:.github/workflows/metal4-command-backend-e2e.yml" > .github/workflows/metal4-command-backend-e2e.yml
          git show "$GITHUB_SHA~4:.github/workflows/metal4-command-backend-source-contract.yml" > .github/workflows/metal4-command-backend-source-contract.yml

          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check

      - name: Commit the source fix and restore normal workflows
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): probe residency factories in validation mode"
          git push origin HEAD:metal4/phase1-command-backend-poc

  build:
    strategy:
      matrix:
        os: [ "macos-26" ]
        platform: [ "macos", "ios" ]
        upload_artifacts: [ true ]
        select_xcode: [ false ]
        private_api: [ false ]

        include:
          - os: "macos-26"
            platform: "macos"
            upload_artifacts: true
            select_xcode: false
            private_api: true
          - os: "macos-26"
            platform: "ios"
            upload_artifacts: true
            select_xcode: false
            private_api: true
      fail-fast: false

    name: MoltenVK (Xcode ${{ matrix.xcode }} - ${{ matrix.platform }}${{ matrix.private_api && '-privateapi' || '' }})

    runs-on: ${{ matrix.os }}

    env:
      XCODE_DEV_PATH: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
      ARTIFACT_TYPE: ${{ matrix.platform }}${{ matrix.private_api && '-privateapi' || '' }}
      BUILD_ARGUMENTS: ${{ matrix.platform }} ${{ matrix.private_api && 'MVK_USE_METAL_PRIVATE_API=1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode version
        if: matrix.select_xcode == true
        run: sudo xcode-select -switch "${XCODE_DEV_PATH}"

      - name: Prep
        id: prep
        run: |
          echo "Get Xcode version info"
          XCODE_VERSION="$(xcodebuild -version)"
          echo "${XCODE_VERSION}"
          XCODE_VERSION="$(echo "${XCODE_VERSION}" | tr '\t\r\n ' '_')"
          echo "${XCODE_VERSION}"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Dependencies
        id: cache-dependencies
        if: success() && !(github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        uses: actions/cache@v3
        with:
          path: |
            External/build
            !External/build/Intermediates
          key: ${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('fetchDependencies','ExternalRevisions/**','ExternalDependencies.xcodeproj/**','Scripts/**') }}

      - name: Fetch Dependencies (Use Built Cache)
        if: steps.cache-dependencies.outputs.cache-hit == 'true'
        run: ./fetchDependencies -v --none

      - name: Fetch Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: ./fetchDependencies -v --${{ matrix.platform }}

      - name: Output Dependency Build Logs on Failure
        if: failure()
        run: cat "dependenciesbuild.log"

      - name: Build MoltenVK
        run: make ${BUILD_ARGUMENTS}

      - name: Output MoltenVK Build Logs on Failure
        if: failure()
        run: |
          if [ -f "xcodebuild.log" ]; then
            cat "xcodebuild.log"
          fi

      - name: Tar Artifacts
        if: success() && matrix.upload_artifacts == true
        run: |
          rm -rf Package/Release/MoltenVKShaderConverter
          tar -C Package -s/Release/MoltenVK/ -cvf "MoltenVK-${ARTIFACT_TYPE}.tar" Release/

      - name: Upload Artifacts
        if: success() && matrix.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: "MoltenVK-${{ env.ARTIFACT_TYPE }}"
          path: "MoltenVK-${{ env.ARTIFACT_TYPE }}.tar"

  build_cmake:
    strategy:
      matrix:
        os: [ "macos-latest" ]
        config: [Debug, Release]
      fail-fast: false

    name: 'MoltenVK (Cmake - ${{ matrix.config }})'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo 'CACHE_PATH=~/Library/Caches/ccache' >> "$GITHUB_ENV"

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2.0.0
        id: cpu-cores

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ matrix.config }}-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

  release:
    name: 'Release'

    needs: [build]

    runs-on: ubuntu-latest

    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          artifacts: "MoltenVK*/*"
          artifactErrorsFailBuild: true
