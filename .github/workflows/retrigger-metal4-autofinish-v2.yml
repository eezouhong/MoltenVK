name: Retrigger definitive Metal 4 acceptance v2

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/retrigger-metal4-autofinish-v2.yml"

permissions:
  contents: write

jobs:
  retrigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          persist-credentials: true
      - name: Make the updated acceptance run exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/zz-autofinish-metal4-game-evaluable.yml')
          source = path.read_text()
          source = source.replace("    if: github.actor != 'github-actions[bot]'\n", '', 1)
          old = "[.workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and ((.id|tostring) != $current))] | length"
          new = "[.workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and ((.id|tostring) != $current) and (.name != \"Autofinish game-evaluable Metal 4 backend\"))] | length"
          if old not in source:
              if new not in source:
                  raise SystemExit('acceptance wait query not found')
          else:
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          rm .github/workflows/retrigger-metal4-autofinish-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(metal4): retrigger definitive game acceptance"
          git push origin HEAD:metal4/phase1-command-backend-poc
