name: Rescue deterministic Metal 4 v7 acceptance failures

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/zzzzzzzz-rescue-metal4-v7.yml"
  workflow_dispatch:

concurrency:
  group: rescue-metal4-v7
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  rescue:
    runs-on: macos-26
    timeout-minutes: 170
    env:
      BRANCH: metal4/phase1-command-backend-poc
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: zzzzzzz-metal4-definitive-v7.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for the current v7 run
        id: first
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9000))
          while :; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=$BRANCH&per_page=20" \
              -o "$RUNNER_TEMP/runs.json"
            run_id="$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")"
            status="$(jq -r '.workflow_runs[0].status // "missing"' "$RUNNER_TEMP/runs.json")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' "$RUNNER_TEMP/runs.json")"
            if [[ "$status" == completed ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              break
            fi
            if ((SECONDS >= deadline)); then
              echo 'Timed out waiting for v7' >&2
              exit 1
            fi
            sleep 20
          done

      - name: Exit when v7 already passed
        if: steps.first.outputs.conclusion == 'success'
        run: echo 'v7 passed; deterministic rescue is not needed.'

      - name: Download failed v7 logs
        if: steps.first.outputs.conclusion != 'success'
        shell: bash
        env:
          RUN_ID: ${{ steps.first.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/first-logs"
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/first-logs.zip"
          unzip -q "$RUNNER_TEMP/first-logs.zip" -d "$RUNNER_TEMP/first-logs"
          cat $(find "$RUNNER_TEMP/first-logs" -type f -print) > "$RUNNER_TEMP/first-combined.log"

      - name: Apply only deterministic corrections
        if: steps.first.outputs.conclusion != 'success'
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          LOG="$RUNNER_TEMP/first-combined.log" python3 - <<'PY'
          from __future__ import annotations
          import os
          import re
          from pathlib import Path

          log = Path(os.environ['LOG']).read_text(encoding='utf-8', errors='replace')
          changed: list[str] = []

          # The extractor accepts substrings. Shorter fragments safely cover wording
          # changes without changing which preparation families execute.
          workflow = Path('.github/workflows/zzzzzzz-metal4-definitive-v7.yml')
          if workflow.is_file() and 'workflow step not found:' in log:
              text = workflow.read_text()
              replacements = {
                  "            'Apply the staged ordinary-render source patch' \\\n": "            'render patch' \\\n",
                  "            'Add a default-off compile-time evaluation switch' \\\n": "            'evaluation switch' \\\n",
                  "            'Add standalone ordinary-render Vulkan E2E' \\\n": "            'ordinary-render Vulkan E2E' \\\n",
                  "            'Add game-run telemetry analyzer and launcher'\n": "            'telemetry analyzer and launcher'\n",
              }
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new, 1)
              if text != original:
                  workflow.write_text(text)
                  changed.append('relaxed embedded-step wording to stable semantic fragments')

          source_paths = [
              *Path('MoltenVK/MoltenVK/Commands').glob('MVKCmd*.h'),
              *Path('MoltenVK/MoltenVK/Commands').glob('MVKCmd*.mm'),
              Path('MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm'),
              Path('MoltenVK/MoltenVK/GPUObjects/MVKPipeline.h'),
          ]
          if re.search(r"undeclared identifier ['\"]mvK|use of undeclared identifier 'mvK|mvK[A-Z].*not found", log):
              for path in source_paths:
                  if not path.is_file():
                      continue
                  text = path.read_text()
                  fixed = re.sub(r'\bmvK(?=[A-Z])', 'mvk', text)
                  if fixed != text:
                      path.write_text(fixed)
                      changed.append(f'normalized MoltenVK helper casing in {path}')

          pipeline = Path('MoltenVK/MoltenVK/GPUObjects/MVKPipeline.h')
          if pipeline.is_file() and 'areAllBitsClear' in log:
              text = pipeline.read_text()
              fixed = text.replace(
                  '_stageResources.resources.allBits.areAllBitsClear()',
                  '_stageResources.resources.allBits.empty()',
              )
              if fixed != text:
                  pipeline.write_text(fixed)
                  changed.append('fixed descriptorless pipeline bitset predicate')

          queue = Path('MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm')
          if queue.is_file():
              text = queue.read_text()
              fixed = text.replace(
                  'addPerformanceInterval(queue->getPerformanceStats().queue.mtlCommandBufferExecution, startTime);',
                  'queue->addPerformanceInterval(queue->getPerformanceStats().queue.mtlCommandBufferExecution, startTime);',
              )
              if re.search(r'(getenv|setenv).*(undeclared|not found)', log, re.I) and '#include <stdlib.h>' not in fixed:
                  lines = fixed.splitlines(keepends=True)
                  insert_at = max((i + 1 for i, line in enumerate(lines) if line.startswith('#include')), default=0)
                  lines.insert(insert_at, '#include <stdlib.h>\n')
                  fixed = ''.join(lines)
              if fixed != text:
                  queue.write_text(fixed)
                  changed.append('fixed queue helper/declaration compile issue')

          test_contract = Path('Scripts/test-metal4-command-backend-phase1.py')
          if test_contract.is_file() and 'areAllBitsClear' in log:
              text = test_contract.read_text()
              fixed = text.replace(
                  'resources\\.allBits\\.areAllBitsClear',
                  'resources\\.allBits\\.empty',
              )
              if fixed != text:
                  test_contract.write_text(fixed)
                  changed.append('updated the exact matching source contract')

          # Treat dependency/network failures as retriable but do not alter source.
          transient = bool(re.search(
              r'(HTTP 5\d\d|timed out|connection reset|Could not resolve host|early EOF|RPC failed|brew.*failed)',
              log,
              re.I,
          ))
          Path('/tmp/rescue-state.txt').write_text(
              ('changed\n' if changed else 'unchanged\n') +
              ('transient\n' if transient else 'not-transient\n') +
              '\n'.join(changed) + '\n',
              encoding='utf-8',
          )
          if not changed and not transient:
              raise SystemExit('failure is not a deterministic build/setup issue; semantic logs are preserved')
          PY
          cat /tmp/rescue-state.txt
          git add -A -- . ':(exclude)Diagnostics/**'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(metal4): apply deterministic v7 acceptance corrections"
            git push origin HEAD:$BRANCH
          fi

      - name: Snapshot previous v7 dispatch runs
        if: steps.first.outputs.conclusion != 'success'
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=$BRANCH&event=workflow_dispatch&per_page=100" \
            | jq -r '.workflow_runs[].id' | sort -n > "$RUNNER_TEMP/before.txt"

      - name: Dispatch one corrected v7 retry
        if: steps.first.outputs.conclusion != 'success'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -d "$(jq -nc --arg ref "$BRANCH" '{ref:$ref}')"

      - name: Wait for the corrected v7 retry
        if: steps.first.outputs.conclusion != 'success'
        id: retry
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9000))
          run_id=""
          while [[ -z "$run_id" ]]; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=$BRANCH&event=workflow_dispatch&per_page=100" \
              -o "$RUNNER_TEMP/retry-runs.json"
            jq -r '.workflow_runs[].id' "$RUNNER_TEMP/retry-runs.json" | sort -n > "$RUNNER_TEMP/after.txt"
            run_id="$(comm -13 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" | tail -n1)"
            [[ -n "$run_id" ]] || sleep 10
            if ((SECONDS >= deadline)); then exit 1; fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          while :; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" -o "$RUNNER_TEMP/retry.json"
            status="$(jq -r '.status' "$RUNNER_TEMP/retry.json")"
            [[ "$status" == completed ]] && break
            ((SECONDS < deadline)) || exit 1
            sleep 20
          done
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/retry.json")" == success ]]

      - name: Preserve the unhandled second failure
        if: failure() && steps.retry.outputs.run_id != ''
        shell: bash
        env:
          RUN_ID: ${{ steps.retry.outputs.run_id }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p Diagnostics "$RUNNER_TEMP/retry-logs"
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" -o "$RUNNER_TEMP/retry.zip"
          unzip -q "$RUNNER_TEMP/retry.zip" -d "$RUNNER_TEMP/retry-logs"
          output="Diagnostics/metal4-v7-rescue-unhandled-$RUN_ID.txt"
          {
            echo "run_id=$RUN_ID"
            grep -RinE 'error:|fatal:|failed|failure|Process completed with exit code|Traceback|AssertionError|not found|undefined|undeclared|fallback' \
              "$RUNNER_TEMP/retry-logs" | tail -n 1200 || true
            while IFS= read -r -d '' log; do
              echo "--- ${log#$RUNNER_TEMP/retry-logs/} ---"
              tail -n 260 "$log"
            done < <(find "$RUNNER_TEMP/retry-logs" -type f -print0)
          } > "$output"
          git add "$output"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "diagnostics(metal4): preserve unhandled v7 rescue failure $RUN_ID"
          git push origin HEAD:$BRANCH
