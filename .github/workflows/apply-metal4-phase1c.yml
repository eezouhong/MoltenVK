name: Apply Metal 4 Phase 1C patch

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/apply-metal4-phase1c.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase1c-patch-v2/chunk-* > "$RUNNER_TEMP/phase1c.b64"
          test "$(wc -c < "$RUNNER_TEMP/phase1c.b64" | tr -d ' ')" -eq 73704
          base64 --decode "$RUNNER_TEMP/phase1c.b64" > "$RUNNER_TEMP/phase1c.patch"
          echo "1726d56911d34809ebb93f095bb105a12f7935f761f4112623829303f8e30208  $RUNNER_TEMP/phase1c.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/phase1c.patch"

      - name: Apply Phase 1C source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/phase1c.patch"

      - name: Run source and ownership gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --cached --check

      - name: Remove temporary patch transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/phase1c-patch-v2
          rm -rf .github/phase1c-patch
          rm -f .github/workflows/apply-metal4-phase1c.yml
          rm -f .github/workflows/metal4-source-snapshot.yml
          rm -f .github/workflows/metal4-phase1c-sdk-probe.yml
          git add -A

      - name: Commit Phase 1C implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(metal4): add Phase 1C compute image and barrier path"
          git push origin HEAD:metal4/phase1-command-backend-poc
