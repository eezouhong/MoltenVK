name: Probe Metal 4 command SDK

on:
  push:
    branches:
      - metal4/sdk-command-probe

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Locate SDK and headers
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          HEADERS="$SDK/System/Library/Frameworks/Metal.framework/Headers"
          echo "SDK=$SDK"
          xcodebuild -version
          find "$HEADERS" -maxdepth 1 -type f | sort | grep -E 'MTL4|Metal\.h' || true

          for file in \
            MTL4CommandQueue.h \
            MTL4CommandBuffer.h \
            MTL4CommandEncoder.h \
            MTL4ComputeCommandEncoder.h \
            MTL4RenderCommandEncoder.h \
            MTL4ArgumentTable.h \
            MTLResidencySet.h \
            MTL4Counters.h; do
            path="$HEADERS/$file"
            echo "===== $file ====="
            if [[ -f "$path" ]]; then
              grep -nE '@protocol|@interface|typedef NS_ENUM|typedef NS_OPTIONS|newCommand|beginCommand|endCommand|commit|feedback|computeCommandEncoder|renderCommandEncoder|copyFrom|fillBuffer|clear|resolve|barrier|waitForEvent|signalEvent|ArgumentTable|argumentTable|Residency|residency|PipelineState|dispatch|draw|useResource|useHeap|set[A-Z]|encode[A-Z]' "$path" || true
            else
              echo "missing"
            fi
          done
