name: Fix definitive Metal 4 E2E fixture

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/consolidate-metal4-acceptance-fixes.yml"

concurrency:
  group: consolidate-metal4-acceptance-fixes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true
      - name: Let earlier one-shot writers settle
        run: sleep 90
      - name: Reset to latest branch and apply every acceptance fix idempotently
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin metal4/phase1-command-backend-poc
          git reset --hard origin/metal4/phase1-command-backend-poc
          python3 - <<'PY'
          import base64
          from pathlib import Path

          patch_dir = Path('.github/render-source-patch')
          chunks = sorted(patch_dir.glob('chunk-*')) if patch_dir.is_dir() else []
          if chunks:
              payload = b''.join(path.read_bytes() for path in chunks)
              if payload.startswith(b'diff --git '):
                  patch = payload
              else:
                  patch = base64.b64decode(b''.join(payload.split()), validate=True)
              if not patch.startswith(b'diff --git '):
                  raise SystemExit('render transport does not decode to a git diff')
              for path in chunks:
                  path.unlink()
              (patch_dir / 'chunk-00').write_bytes(patch)

          queue = Path('MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm')
          queue_source = queue.read_text()
          if '#include <cstdlib>' not in queue_source:
              lines = queue_source.splitlines(keepends=True)
              insert_at = 0
              for index, line in enumerate(lines):
                  if line.startswith('#include'):
                      insert_at = index + 1
              if not insert_at:
                  raise SystemExit('MVKQueue.mm include block not found')
              lines.insert(insert_at, '#include <cstdlib>\n')
              queue.write_text(''.join(lines))

          workflow = Path('.github/workflows/zz-autofinish-metal4-game-evaluable.yml')
          source = workflow.read_text()
          source = source.replace('  cancel-in-progress: false\n', '  cancel-in-progress: true\n', 1)
          source = source.replace("    if: github.actor != 'github-actions[bot]'\n", '', 1)

          wait_queries = (
              '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and ((.id|tostring) != $current))] | length',
              '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and ((.id|tostring) != $current) and (.name != "Autofinish game-evaluable Metal 4 backend"))] | length',
          )
          writer_query = '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and ((.id|tostring) != $current) and (.name != "Autofinish game-evaluable Metal 4 backend") and (.name | test("Normalize staged Metal 4 render patch|Fix definitive Metal 4 E2E fixture|Retrigger definitive Metal 4 acceptance v2|Add explicit stdlib dependency for Metal 4 evaluation switch|Apply Metal 4 basic render source patch|Install Metal 4 game evaluation tooling|Add Metal 4 evaluation default switch|Finalize game-evaluable Metal 4 backend|Add and verify Metal 4 ordinary render E2E|Fix Metal 4 render E2E runner prerequisites|Publish Metal 4 game-readiness manifest")))] | length'
          if writer_query not in source:
              for candidate in wait_queries:
                  if candidate in source:
                      source = source.replace(candidate, writer_query, 1)
                      break
              else:
                  raise SystemExit('acceptance wait query not found')

          old_buffer = '''              Buffer() = default;
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
          };
          '''
          new_buffer = '''              Buffer() = default;
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
              Buffer(Buffer&& other) noexcept :
                  device(other.device), buffer(other.buffer), memory(other.memory),
                  size(other.size), coherent(other.coherent) {
                  other.device = VK_NULL_HANDLE;
                  other.buffer = VK_NULL_HANDLE;
                  other.memory = VK_NULL_HANDLE;
                  other.size = 0;
                  other.coherent = false;
              }
              Buffer& operator=(Buffer&& other) noexcept {
                  if (this == &other) { return *this; }
                  destroy();
                  device = other.device;
                  buffer = other.buffer;
                  memory = other.memory;
                  size = other.size;
                  coherent = other.coherent;
                  other.device = VK_NULL_HANDLE;
                  other.buffer = VK_NULL_HANDLE;
                  other.memory = VK_NULL_HANDLE;
                  other.size = 0;
                  other.coherent = false;
                  return *this;
              }
          };
          '''
          if old_buffer in source:
              source = source.replace(old_buffer, new_buffer, 1)
          elif 'Buffer(Buffer&& other) noexcept' not in source:
              raise SystemExit('generated E2E Buffer block not found')

          workflow.write_text(source)
          PY
          rm -f .github/workflows/consolidate-metal4-acceptance-fixes.yml
          rm -f .github/workflows/normalize-metal4-render-patch.yml
          rm -f .github/workflows/fix-metal4-autofinish-fixture.yml
          rm -f .github/workflows/retrigger-metal4-autofinish-v2.yml
          rm -f .github/workflows/add-metal4-eval-cstdlib.yml
          rm -f .github/workflows/accelerate-metal4-autofinish.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(metal4): consolidate definitive acceptance fixes"
          git push origin HEAD:metal4/phase1-command-backend-poc
