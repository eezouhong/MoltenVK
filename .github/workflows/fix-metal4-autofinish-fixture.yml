name: Fix definitive Metal 4 E2E fixture

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/fix-metal4-autofinish-fixture.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          persist-credentials: true
      - name: Add explicit move ownership to generated readback buffer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/zz-autofinish-metal4-game-evaluable.yml')
          source = path.read_text()
          old = '''              Buffer() = default;
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
          };
          '''
          new = '''              Buffer() = default;
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
              Buffer(Buffer&& other) noexcept :
                  device(other.device), buffer(other.buffer), memory(other.memory),
                  size(other.size), coherent(other.coherent) {
                  other.device = VK_NULL_HANDLE;
                  other.buffer = VK_NULL_HANDLE;
                  other.memory = VK_NULL_HANDLE;
                  other.size = 0;
                  other.coherent = false;
              }
              Buffer& operator=(Buffer&& other) noexcept {
                  if (this == &other) { return *this; }
                  destroy();
                  device = other.device;
                  buffer = other.buffer;
                  memory = other.memory;
                  size = other.size;
                  coherent = other.coherent;
                  other.device = VK_NULL_HANDLE;
                  other.buffer = VK_NULL_HANDLE;
                  other.memory = VK_NULL_HANDLE;
                  other.size = 0;
                  other.coherent = false;
                  return *this;
              }
          };
          '''
          if old not in source:
              if 'Buffer(Buffer&& other) noexcept' not in source:
                  raise SystemExit('generated Buffer ownership block not found')
          else:
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          rm .github/workflows/fix-metal4-autofinish-fixture.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(metal4): fix render E2E resource ownership"
          git push origin HEAD:metal4/phase1-command-backend-poc
