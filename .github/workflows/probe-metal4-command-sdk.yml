name: Probe Metal 4 command SDK

on:
  push:
    branches:
      - metal4/sdk-command-probe

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Print exact SDK command signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/Metal.framework/Headers"
          echo "SDK=$SDK"
          xcodebuild -version

          dump_file() {
            local file="$1"
            echo "===== $file ====="
            cat "$H/$file"
          }

          dump_file MTL4RenderPass.h
          dump_file MTL4RenderCommandEncoder.h
          dump_file MTL4ArgumentTable.h
          dump_file MTL4CommandBuffer.h

          echo '===== MTLDevice factories ====='
          grep -n -B 8 -A 20 -E 'newArgumentTableWithDescriptor|newMTL4CommandQueueWithDescriptor|newCommandAllocatorWithDescriptor' "$H/MTLDevice.h"
