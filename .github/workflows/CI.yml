name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize_cache_memory_diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0
      - name: Apply and validate production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/test-metal4-shared-shader-repository.py')
          text = path.read_text()
          marker = '"Metal 4 shared shader-library repository summary:"'
          marker_pos = text.index(marker)
          start = text.rfind('    require(', 0, marker_pos)
          end = text.index('    )', marker_pos) + len('    )')
          replacement = '    require(shader_mm, "Metal 4 shared shader-library repository summary:", SHADER_MM)'
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python3 Scripts/apply-cache-memory-diagnostics.py
          python3 Scripts/test-metal4-shared-shader-repository.py
          git diff --check
          git checkout 39368cc23fd98fe7f0abaf2c99406b65b9a905a0 -- .github/workflows/CI.yml
          git rm Scripts/apply-cache-memory-diagnostics.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "diag(metal4): expose cache memory and rehydrate costs"
          git push origin HEAD:codex/shared-shader-library-repository-phase1
