name: Fix Metal 4 E2E Vulkan initialization

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - .github/workflows/fix-metal4-e2e-vulkan-init.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Zero-initialize Vulkan E2E structures
        run: python3 Scripts/fix-metal4-e2e-vulkan-init.py

      - name: Validate source contracts and patch hygiene
        run: |
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check

      - name: Commit E2E repair
        run: |
          git add Tests/Metal4CommandBackend/metal4_transfer_e2e.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(metal4): zero-initialize Vulkan E2E structures"
          git push origin HEAD:metal4/phase1-command-backend-poc
