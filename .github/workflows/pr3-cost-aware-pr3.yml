name: PR3 cost-aware source materialization v3

on:
  pull_request:
    paths:
      - .github/workflows/pr3-cost-aware-pr3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0

      - name: Execute transformation and harden acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr3-cost-aware-materialize-once.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if begin not in source or end not in source:
              raise SystemExit('PR3 transformation payload not found')
          script = source.split(begin, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(script), 'pr3-cost-aware-transform.py', 'exec'))

          # Restore strict append-only ABI order. New v46 fields are appended after
          # every v45 repository-statistics member instead of being inserted within it.
          api = Path('MoltenVK/MoltenVK/API/mvk_private_api.h')
          text = api.read_text()
          old = '''    uint64_t rehydrateMaximumNanoseconds;
              uint64_t costAwareCandidateCount;
              uint64_t costAwareEvictionCount;
              uint64_t rehydrateProtectionSkipCount;
              uint64_t unknownRehydrateCostCandidateCount;
              uint64_t dedupeHitCount;
              uint64_t raceLoserCount;
              uint64_t residentAdoptionCount;
              uint64_t snapshotSkippedShaderLibraryCount;
          '''
          new = '''    uint64_t rehydrateMaximumNanoseconds;
              uint64_t dedupeHitCount;
              uint64_t raceLoserCount;
              uint64_t residentAdoptionCount;
              uint64_t snapshotSkippedShaderLibraryCount;
              uint64_t costAwareCandidateCount;
              uint64_t costAwareEvictionCount;
              uint64_t rehydrateProtectionSkipCount;
              uint64_t unknownRehydrateCostCandidateCount;
          '''
          if old not in text:
              raise SystemExit('expected transformed repository ABI block missing')
          api.write_text(text.replace(old, new, 1))

          test = Path('Scripts/test-metal4-shared-shader-repository.py')
          text = test.read_text()
          old_block = '''    trim = shader_mm.index("void MVKShaderLibraryRepository::trimToResidentLimit")
              trim_body = shader_mm[trim : trim + 3000]
              assert "_residentTrimHighWater" in trim_body
              lock_end = trim_body.index("sort(candidates.begin()")
              evict_call = trim_body.index("candidate.library->tryEvictResident(candidate.lastUseSequence)")
              assert lock_end < evict_call
              assert "getLastUseSequence()" in trim_body
              assert "tryEvictResident(candidate.lastUseSequence)" in trim_body
              eviction_start = shader_mm.index(
                  "bool MVKShaderLibrary::tryEvictResident(uint64_t expectedLastUseSequence)"
              )
              eviction_guard = shader_mm[eviction_start : eviction_start + 700]
              assert "_activeUseCount.load(memory_order_acquire) != 0" in eviction_guard
              assert "getLastUseSequence() != expectedLastUseSequence" in eviction_guard
              assert "library->retain()" in trim_body
              assert "candidate.library->release()" in trim_body
          '''
          # The original transform already rewrites two of these strings in some executions,
          # so replace by method-range boundaries rather than relying on one exact variant.
          start = text.index('    trim = shader_mm.index("void MVKShaderLibraryRepository::trimToResidentLimit")')
          end_marker = '    acquire_start = shader_mm.index("MVKShaderLibrary* MVKShaderLibraryRepository::acquire(")'
          end = text.index(end_marker, start)
          new_block = '''    trim = shader_mm.index("void MVKShaderLibraryRepository::trimToResidentLimit")
              trim_end = shader_mm.index(
                  "\\nMVKShaderLibrary* MVKShaderLibraryRepository::acquire(", trim
              )
              trim_body = shader_mm[trim:trim_end]
              assert "_residentTrimHighWater" in trim_body
              lock_end = trim_body.index("sort(candidates.begin()")
              evict_call = trim_body.index(
                  "candidate.library->tryEvictResident(candidate.snapshot, currentUseSequence)"
              )
              assert lock_end < evict_call
              assert "tryGetEvictionSnapshot(snapshot)" in trim_body
              assert "rehydrateProtectedUntilSequence" in trim_body
              assert "kUnknownRehydrateCostNanoseconds" in trim_body
              assert "_costAwareCandidateCount" in trim_body
              eviction_start = shader_mm.index(
                  "bool MVKShaderLibrary::tryEvictResident("
              )
              eviction_guard = shader_mm[eviction_start : eviction_start + 1400]
              assert "_activeUseCount.load(memory_order_acquire) != 0" in eviction_guard
              assert "getLastUseSequence() != snapshot.lastUseSequence" in eviction_guard
              assert "currentUseSequence < snapshot.rehydrateProtectedUntilSequence" in eviction_guard
              assert "library->retain()" in trim_body
              assert "candidate.library->release()" in trim_body
          '''
          # Normalize workflow indentation to Python source indentation.
          new_block = textwrap.dedent(new_block).replace('\n', '\n    ').lstrip()
          new_block = '    ' + new_block.rstrip() + '\n'
          test.write_text(text[:start] + new_block + text[end:])

          # Add explicit append-only ABI-order guard.
          text = test.read_text()
          abi_marker = '    require(private_api_h, "vkGetMetal4ShaderLibraryRepositoryStatisticsMVK", PRIVATE_API_H)\n'
          abi_guard = '''    require(private_api_h, "vkGetMetal4ShaderLibraryRepositoryStatisticsMVK", PRIVATE_API_H)\n    assert private_api_h.index("snapshotSkippedShaderLibraryCount") < private_api_h.index("costAwareCandidateCount")\n    assert private_api_h.index("costAwareCandidateCount") < private_api_h.index("unknownRehydrateCostCandidateCount")\n'''
          if abi_marker not in text:
              raise SystemExit('private API test marker missing')
          test.write_text(text.replace(abi_marker, abi_guard, 1))
          BOOT

          python3 Scripts/test-metal4-shared-shader-repository.py
          git diff --check
          grep -F '#define MVK_PRIVATE_API_VERSION   46' MoltenVK/MoltenVK/API/mvk_private_api.h
          grep -F 'currentUseSequence + 256' MoltenVK/MoltenVK/GPUObjects/MVKShaderModule.mm
          grep -F 'kUnknownRehydrateCostNanoseconds' MoltenVK/MoltenVK/GPUObjects/MVKShaderModule.mm

      - name: Commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          git add MoltenVK Scripts
          if git diff --cached --quiet; then
            echo 'No source changes produced.'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'perf(metal4): make repository eviction cost aware'
          git pull --rebase origin codex/shared-shader-library-repository-phase1
          git push origin HEAD:codex/shared-shader-library-repository-phase1
