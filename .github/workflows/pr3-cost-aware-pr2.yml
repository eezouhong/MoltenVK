name: PR3 cost-aware source materialization v2

on:
  pull_request:
    paths:
      - .github/workflows/pr3-cost-aware-pr2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0
      - name: Fix cost-aware lock ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mm = Path('MoltenVK/MoltenVK/GPUObjects/MVKShaderModule.mm')
          text = mm.read_text()
          start = text.index('void MVKShaderLibraryRepository::trimToResidentLimit(')
          end = text.index('\nMVKShaderLibrary* MVKShaderLibraryRepository::acquire(', start)
          body = text[start:end]
          if 'vector<MVKShaderLibrary*> retainedLibraries;' not in body:
              p0 = body.index('\tvector<Candidate> candidates;')
              p1 = body.index('\n\t_trimCandidateCount.fetch_add', p0)
              replacement = '''\tvector<MVKShaderLibrary*> retainedLibraries;\n\t{\n\t\tlock_guard<mutex> lock(_lock);\n\t\tfor (auto& moduleEntries : _entries) {\n\t\t\tfor (Entry& entry : moduleEntries.second) {\n\t\t\t\tMVKShaderLibrary* library = entry.library;\n\t\t\t\tif (library == protectedLibrary ||\n\t\t\t\t\t!library->isResident() ||\n\t\t\t\t\t!library->_repositoryResidentCounted.load(memory_order_acquire)) {\n\t\t\t\t\tcontinue;\n\t\t\t\t}\n\t\t\t\tlibrary->retain();\n\t\t\t\tretainedLibraries.push_back(library);\n\t\t\t}\n\t\t}\n\t}\n\n\tvector<Candidate> candidates;\n\tcandidates.reserve(retainedLibraries.size());\n\tfor (MVKShaderLibrary* library : retainedLibraries) {\n\t\tMVKShaderLibraryEvictionSnapshot snapshot;\n\t\tif (!library->tryGetEvictionSnapshot(snapshot)) { continue; }\n\t\tif (currentUseSequence < snapshot.rehydrateProtectedUntilSequence) {\n\t\t\t_rehydrateProtectionSkipCount.fetch_add(1, memory_order_relaxed);\n\t\t\tcontinue;\n\t\t}\n\t\tuint64_t coldness = currentUseSequence >= snapshot.lastUseSequence\n\t\t\t? currentUseSequence - snapshot.lastUseSequence : 0;\n\t\tuint64_t benefitPages = min<uint64_t>(snapshot.reclaimableUncompressedMSLBytes / 4096, 65535);\n\t\tuint64_t rehydrateCost = snapshot.lastRehydrateNanoseconds;\n\t\tif (rehydrateCost == 0) {\n\t\t\trehydrateCost = kUnknownRehydrateCostNanoseconds;\n\t\t\t_unknownRehydrateCostCandidateCount.fetch_add(1, memory_order_relaxed);\n\t\t}\n\t\tuint64_t costMicros = min<uint64_t>(rehydrateCost / 1000, 65535);\n\t\tuint64_t score = (min<uint64_t>(coldness, 65535) * 4) + (benefitPages * 2) + (65535 - costMicros);\n\t\tcandidates.push_back({ score, snapshot, library });\n\t}\n'''
              body = body[:p0] + replacement + body[p1:]
              body = body.replace('for (const Candidate& candidate : candidates) { candidate.library->release(); }', 'for (MVKShaderLibrary* library : retainedLibraries) { library->release(); }', 1)
              mm.write_text(text[:start] + body + text[end:])

          test = Path('Scripts/test-metal4-shared-shader-repository.py')
          t = test.read_text()
          marker = '    assert "tryGetEvictionSnapshot(snapshot)" in trim_body\n'
          if marker in t and 'retained_collect = trim_body.index' not in t:
              t = t.replace(marker, marker + '    retained_collect = trim_body.index("retainedLibraries.push_back(library)")\n    snapshot_call = trim_body.index("tryGetEvictionSnapshot(snapshot)")\n    assert retained_collect < snapshot_call\n', 1)
              test.write_text(t)
          PY
          python3 Scripts/test-metal4-shared-shader-repository.py
          git diff --check
      - name: Commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          git add MoltenVK Scripts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(metal4): avoid repository shader-library lock inversion'
          git pull --rebase origin codex/shared-shader-library-repository-phase1
          git push origin HEAD:codex/shared-shader-library-repository-phase1
