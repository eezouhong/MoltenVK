name: Metal 4 Command Backend E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - "MoltenVK/MoltenVK/Commands/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.*"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.*"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - "Tests/Metal4CommandBackend/**"
      - ".github/workflows/metal4-command-backend-e2e.yml"
  pull_request:
    paths:
      - "MoltenVK/MoltenVK/Commands/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.*"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.*"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - "Tests/Metal4CommandBackend/**"
      - ".github/workflows/metal4-command-backend-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: ${{ matrix.platform == 'macos' && 'macOS build + Vulkan E2E' || 'iOS device build' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply validation-only residency capability probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          queue_path = Path("MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm")
          source = queue_path.read_text()
          marker = "Metal 4 validation override will probe the public residency-set factory"
          if marker not in source:
              old = '''\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
'''
              new = '''\tif (!getMetalFeatures().residencySets && !validationOverride) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 validation override will probe the public residency-set factory despite the missing capability advertisement.");
\t}
'''
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one residency capability gate, found {source.count(old)}")
              queue_path.write_text(source.replace(old, new, 1))

          contract_path = Path("Scripts/test-metal4-command-backend-phase1.py")
          contract = contract_path.read_text()
          contract_marker = "production residency capability gate can be bypassed"
          if contract_marker not in contract:
              anchor = '''    require(queue_mm, r"mvkOSVersionIsAtLeast\\(\\s*26\\.0\\s*\\)", "OS 26 gate is missing")
'''
              addition = anchor + '''    require(
        queue_mm,
        r"!getMetalFeatures\\(\\)\\.residencySets\\s*&&\\s*!validationOverride",
        "production residency capability gate can be bypassed without the private validation override",
    )
    require(
        queue_mm,
        r"validation override will probe the public residency-set factory",
        "validation cannot test the real public residency factory when feature advertisement is incomplete",
    )
'''
              if contract.count(anchor) != 1:
                  raise SystemExit(f"expected one source-contract anchor, found {contract.count(anchor)}")
              contract_path.write_text(contract.replace(anchor, addition, 1))
          PY

      - name: Run source contracts
        run: |
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          git diff --check

      - name: Fetch ${{ matrix.platform }} dependencies
        run: ./fetchDependencies -v --${{ matrix.platform }}

      - name: Build ${{ matrix.platform }} package
        run: make ${{ matrix.platform }}

      - name: Run independent Vulkan Phase 1C E2E
        if: matrix.platform == 'macos'
        run: bash Tests/Metal4CommandBackend/run-macos.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal4-command-backend-${{ matrix.platform }}-${{ github.sha }}
          path: |
            xcodebuild.log
            dependenciesbuild.log
            build/metal4-command-backend-e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  commit-validated-fix:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify and apply the exact tested source change
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin metal4/phase1-command-backend-poc
          current="$(git rev-parse origin/metal4/phase1-command-backend-poc)"
          if [[ "$current" != "$TESTED_SHA" ]]; then
            echo "Branch advanced from tested SHA $TESTED_SHA to $current; refusing to commit untested source." >&2
            exit 1
          fi
          git reset --hard "$current"

          python3 - <<'PY'
          from pathlib import Path

          queue_path = Path("MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm")
          source = queue_path.read_text()
          marker = "Metal 4 validation override will probe the public residency-set factory"
          if marker not in source:
              old = '''\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
'''
              new = '''\tif (!getMetalFeatures().residencySets && !validationOverride) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 validation override will probe the public residency-set factory despite the missing capability advertisement.");
\t}
'''
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one residency capability gate, found {source.count(old)}")
              queue_path.write_text(source.replace(old, new, 1))

          contract_path = Path("Scripts/test-metal4-command-backend-phase1.py")
          contract = contract_path.read_text()
          contract_marker = "production residency capability gate can be bypassed"
          if contract_marker not in contract:
              anchor = '''    require(queue_mm, r"mvkOSVersionIsAtLeast\\(\\s*26\\.0\\s*\\)", "OS 26 gate is missing")
'''
              addition = anchor + '''    require(
        queue_mm,
        r"!getMetalFeatures\\(\\)\\.residencySets\\s*&&\\s*!validationOverride",
        "production residency capability gate can be bypassed without the private validation override",
    )
    require(
        queue_mm,
        r"validation override will probe the public residency-set factory",
        "validation cannot test the real public residency factory when feature advertisement is incomplete",
    )
'''
              if contract.count(anchor) != 1:
                  raise SystemExit(f"expected one source-contract anchor, found {contract.count(anchor)}")
              contract_path.write_text(contract.replace(anchor, addition, 1))
          PY

          rm -f .github/workflows/fix-metal4-validation-residency.yml
          git show "$TESTED_SHA^:.github/workflows/metal4-command-backend-e2e.yml" > .github/workflows/metal4-command-backend-e2e.yml
          git show "$TESTED_SHA~3:.github/workflows/metal4-command-backend-source-contract.yml" > .github/workflows/metal4-command-backend-source-contract.yml

          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): probe residency factories in validation mode"
          git push origin HEAD:metal4/phase1-command-backend-poc
