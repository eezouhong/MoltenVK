name: Fix Metal 4 bitset compile blocker

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - .github/workflows/fix-metal4-bitset-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source repair
        run: python3 Scripts/fix-metal4-bitset-build.py

      - name: Validate source contracts
        run: |
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check

      - name: Commit source repair
        run: |
          rm Scripts/fix-metal4-bitset-build.py
          rm .github/workflows/fix-metal4-bitset-build.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): use the small-bitset clear predicate"
          git push origin HEAD:metal4/phase1-command-backend-poc
