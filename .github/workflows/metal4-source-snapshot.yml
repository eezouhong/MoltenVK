name: Metal 4 Source Snapshot

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/metal4-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact checkout
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/EXACT_SHA"
          tar --exclude=.git -czf "$RUNNER_TEMP/moltenvk-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: moltenvk-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moltenvk-source.tar.gz
            ${{ runner.temp }}/EXACT_SHA
          if-no-files-found: error
          retention-days: 1
