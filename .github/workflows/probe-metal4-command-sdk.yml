name: Probe Metal 4 command SDK

on:
  push:
    branches:
      - metal4/sdk-command-probe

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Print focused Metal 4 render signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/Metal.framework/Headers"
          xcodebuild -version
          echo "SDK=$SDK"

          for pattern in \
            'drawPrimitives:' \
            'drawIndexedPrimitives:' \
            'setRenderPipelineState:' \
            'setArgumentTable:' \
            'setViewport:' \
            'setScissorRect:' \
            'setCullMode:' \
            'setFrontFacingWinding:' \
            'setTriangleFillMode:' \
            'endEncoding'; do
            echo "===== MTL4RenderCommandEncoder $pattern ====="
            grep -n -B 6 -A 18 -- "$pattern" "$H/MTL4RenderCommandEncoder.h" || true
          done

          for pattern in \
            '@interface MTL4RenderPassDescriptor' \
            '@interface MTL4RenderPassColorAttachmentDescriptor' \
            'colorAttachments' \
            'renderTargetWidth' \
            'renderTargetHeight' \
            'renderTargetArrayLength' \
            '@property.*texture' \
            '@property.*level' \
            '@property.*slice' \
            '@property.*loadAction' \
            '@property.*storeAction' \
            '@property.*clearColor'; do
            echo "===== MTL4RenderPass $pattern ====="
            grep -n -B 6 -A 18 -E -- "$pattern" "$H/MTL4RenderPass.h" || true
          done
