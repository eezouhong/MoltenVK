name: Diagnose definitive Metal 4 acceptance failure

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/diagnose-metal4-autofinish.yml"

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: metal4/phase1-command-backend-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for the definitive run to finish
        shell: bash
        run: |
          set -euo pipefail
          sleep 900
          deadline=$((SECONDS + 900))
          while :; do
            data="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/zz-autofinish-metal4-game-evaluable.yml/runs?branch=$BRANCH&per_page=20")"
            status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$data")"
            if [[ "$status" == completed || "$status" == missing ]]; then
              printf '%s' "$data" > "$RUNNER_TEMP/runs.json"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo 'Definitive run is still active; no failure diagnostic emitted.'
              exit 0
            fi
            sleep 30
          done
      - name: Exit cleanly when readiness exists or the run passed
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 15 \
            https://raw.githubusercontent.com/eezouhong/MoltenVK/$BRANCH/metal4-game-readiness.json \
            -o "$RUNNER_TEMP/readiness.json"; then
            echo 'diagnose=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion="$(jq -r '.workflow_runs[0].conclusion // "missing"' "$RUNNER_TEMP/runs.json")"
          if [[ "$conclusion" == success || "$conclusion" == missing ]]; then
            echo 'diagnose=false' >> "$GITHUB_OUTPUT"
          else
            echo 'diagnose=true' >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_runs[0].id' "$RUNNER_TEMP/runs.json")" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(jq -r '.workflow_runs[0].head_sha' "$RUNNER_TEMP/runs.json")" >> "$GITHUB_OUTPUT"
            echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and summarize exact run logs
        if: steps.decision.outputs.diagnose == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.decision.outputs.run_id }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CONCLUSION: ${{ steps.decision.outputs.conclusion }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/logs.zip"
          mkdir -p "$RUNNER_TEMP/logs"
          unzip -q "$RUNNER_TEMP/logs.zip" -d "$RUNNER_TEMP/logs"
          mkdir -p Diagnostics
          output="Diagnostics/metal4-autofinish-failure-$RUN_ID.txt"
          {
            echo "workflow=Autofinish game-evaluable Metal 4 backend"
            echo "run_id=$RUN_ID"
            echo "head_sha=$HEAD_SHA"
            echo "conclusion=$CONCLUSION"
            echo
            echo '===== ERROR SUMMARY ====='
            grep -RinE '(^|[^[:alpha:]])(error:|fatal:|failed|failure|No such file|not found|undefined|undeclared|AssertionError|Traceback|Process completed with exit code)' \
              "$RUNNER_TEMP/logs" | tail -n 500 || true
            echo
            echo '===== FINAL 120 LINES PER LOG ====='
            while IFS= read -r -d '' log; do
              echo
              echo "--- ${log#$RUNNER_TEMP/logs/} ---"
              tail -n 120 "$log"
            done < <(find "$RUNNER_TEMP/logs" -type f -print0)
          } > "$output"
          rm -f .github/workflows/diagnose-metal4-autofinish.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "diagnostics(metal4): record definitive acceptance failure $RUN_ID"
          git push origin HEAD:$BRANCH
      - name: Remove diagnostic workflow after a successful run
        if: steps.decision.outputs.diagnose != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-metal4-autofinish.yml
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci(metal4): remove completed acceptance diagnostic"
            git push origin HEAD:$BRANCH
          fi
