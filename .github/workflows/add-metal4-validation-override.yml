name: Add Metal 4 validation override

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - .github/workflows/add-metal4-validation-override.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true
      - run: python3 Scripts/add-metal4-validation-override.py
      - name: Validate source boundary
        run: |
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check
      - name: Commit source and test change
        run: |
          git add \
            MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm \
            Tests/Metal4CommandBackend/run-macos.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(metal4): validate public MTL4 APIs on paravirtual runners"
          git push origin HEAD:metal4/phase1-command-backend-poc
