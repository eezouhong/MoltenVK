name: Metal 4 Command Backend Source Contract

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommand.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.mm"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.mm"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.h"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.mm"
      - "Tests/Metal4CommandBackend/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm"
      - "MoltenVK/MoltenVK/Utility/MVKConfigMembers.def"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - ".github/workflows/metal4-command-backend-source-contract.yml"
  pull_request:
    paths:
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommand.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.mm"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.mm"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.h"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.mm"
      - "Tests/Metal4CommandBackend/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm"
      - "MoltenVK/MoltenVK/Utility/MVKConfigMembers.def"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - ".github/workflows/metal4-command-backend-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify usable Metal 4 transfer backend contract
        run: python3 Scripts/test-metal4-command-backend-phase1.py

  apply-validation-residency-fix:
    if: github.event_name == 'push' && github.ref_name == 'metal4/phase1-command-backend-poc' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Apply validation-only public residency factory probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          queue_path = Path("MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm")
          source = queue_path.read_text()
          old = '''\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
'''
          new = '''\tif (!getMetalFeatures().residencySets && !validationOverride) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 command backend requested but residency sets are unavailable.");
\t\treturn;
\t}
\tif (!getMetalFeatures().residencySets) {
\t\t_device->reportMessage(MVK_CONFIG_LOG_LEVEL_INFO,
\t\t\t\t\t\t  "Metal 4 validation override will probe the public residency-set factory despite the missing capability advertisement.");
\t}
'''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one residency capability gate, found {source.count(old)}")
          queue_path.write_text(source.replace(old, new, 1))

          contract_path = Path("Scripts/test-metal4-command-backend-phase1.py")
          contract = contract_path.read_text()
          anchor = '''    require(queue_mm, r"mvkOSVersionIsAtLeast\\(\\s*26\\.0\\s*\\)", "OS 26 gate is missing")
'''
          addition = anchor + '''    require(
        queue_mm,
        r"!getMetalFeatures\\(\\)\\.residencySets\\s*&&\\s*!validationOverride",
        "production residency capability gate can be bypassed without the private validation override",
    )
    require(
        queue_mm,
        r"validation override will probe the public residency-set factory",
        "validation cannot test the real public residency factory when feature advertisement is incomplete",
    )
'''
          if contract.count(anchor) != 1:
              raise SystemExit(f"expected one source-contract anchor, found {contract.count(anchor)}")
          contract_path.write_text(contract.replace(anchor, addition, 1))

          standalone = Path(".github/workflows/fix-metal4-validation-residency.yml")
          if standalone.exists():
              standalone.unlink()

          clean_workflow = '''name: Metal 4 Command Backend Source Contract

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommand.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.mm"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.mm"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.h"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.mm"
      - "Tests/Metal4CommandBackend/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm"
      - "MoltenVK/MoltenVK/Utility/MVKConfigMembers.def"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - ".github/workflows/metal4-command-backend-source-contract.yml"
  pull_request:
    paths:
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommand.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCommandBuffer.mm"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.h"
      - "MoltenVK/MoltenVK/Commands/MVKCmdTransfer.mm"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.h"
      - "MoltenVK/MoltenVK/GPUObjects/MVKSync.mm"
      - "Tests/Metal4CommandBackend/**"
      - "MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm"
      - "MoltenVK/MoltenVK/Utility/MVKConfigMembers.def"
      - "Scripts/test-metal4-command-backend-phase1.py"
      - ".github/workflows/metal4-command-backend-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify usable Metal 4 transfer backend contract
        run: python3 Scripts/test-metal4-command-backend-phase1.py
'''
          Path(".github/workflows/metal4-command-backend-source-contract.yml").write_text(clean_workflow)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): probe residency factories in validation mode"
          git push origin HEAD:metal4/phase1-command-backend-poc
