name: Fix Metal 4 render E2E runner prerequisites

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/fix-metal4-render-e2e-runner.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          persist-credentials: true
      - name: Make glslang setup data-dependent inside the shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/add-metal4-render-e2e.yml')
          source = path.read_text()
          bad = "        if: ${{ !contains(hashFiles('Tests/Metal4CommandBackend/metal4_transfer_e2e.cpp'), '') }}\n"
          if bad in source:
              source = source.replace(bad, '', 1)
          path.write_text(source)
          PY
          rm .github/workflows/fix-metal4-render-e2e-runner.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(metal4): fix render E2E shader prerequisite"
          git push origin HEAD:metal4/phase1-command-backend-poc
