name: Apply Metal 4 Phase 1C render path

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/apply-metal4-phase1c-render.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact render patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase1c-render-patch-gz/chunk-* > "$RUNNER_TEMP/phase1c-render.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/phase1c-render.patch.gz.b64" | tr -d ' ')" -eq 21516
          base64 --decode "$RUNNER_TEMP/phase1c-render.patch.gz.b64" > "$RUNNER_TEMP/phase1c-render.patch.gz"
          echo "64c3bd1a4d37b8bf22bd8fc44eaf911176a654440cd0f6ee1a5f24ee6e3111b9  $RUNNER_TEMP/phase1c-render.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/phase1c-render.patch.gz" > "$RUNNER_TEMP/phase1c-render.patch"
          echo "97abcbb0f7ec5a0d923cb4d5d23a66cf545c8f6805f3371e9908cbb6119aebe3  $RUNNER_TEMP/phase1c-render.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/phase1c-render.patch"

      - name: Apply Phase 1C render implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/phase1c-render.patch"

      - name: Run source and ownership gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --cached --check

      - name: Remove temporary patch transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/phase1c-render-patch-gz
          rm -rf .github/phase1c-render-patch
          rm -rf .github/render-source-patch
          rm -f .github/workflows/apply-metal4-phase1c-render.yml
          rm -f .github/workflows/metal4-current-source-snapshot.yml
          git add -A
          git diff --cached --check

      - name: Commit Phase 1C render path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(metal4): add strict Phase 1C render submit path"
          git push origin HEAD:metal4/phase1-command-backend-poc
