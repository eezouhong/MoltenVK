name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-specialization-eviction-accounting-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0

      - name: Apply production fix
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply-specialization-eviction-accounting-fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/test-metal4-shared-shader-repository.py')
          text = path.read_text()
          old = '    assert "_compressedMSL" not in eviction_body\n'
          new = (
              '    assert "_compressedMSL.clear" not in eviction_body\n'
              '    assert "_compressedMSL =" not in eviction_body\n'
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f'cold-payload assertion count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 Scripts/test-metal4-shared-shader-repository.py
          git diff --check
          git rm -f Scripts/apply-specialization-eviction-accounting-fix.py
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/CI.yml
          git commit -m \
            "fix(metal4): account specialization payloads on eviction"
          git push origin HEAD:codex/shared-shader-library-repository-phase1
