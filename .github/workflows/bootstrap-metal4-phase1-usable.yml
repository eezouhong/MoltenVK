name: Apply usable Metal 4 Phase 1

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/bootstrap-metal4-phase1-usable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and apply exact patch
        run: |
          set -euo pipefail
          cat .github/bootstrap/metal4-phase1-usable.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/metal4-phase1-usable.patch"
          echo "d7569a33dba5ac7c636951b4c9a54f1dd1f115f53022063bc5e4708dc51230c2  $RUNNER_TEMP/metal4-phase1-usable.patch" \
            | sha256sum --check
          git apply --check "$RUNNER_TEMP/metal4-phase1-usable.patch"
          git apply --index "$RUNNER_TEMP/metal4-phase1-usable.patch"

      - name: Validate independent gates
        run: |
          set -euo pipefail
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --cached --check

      - name: Commit implementation
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/metal4-phase1-usable.patch.gz.b64.*
          rm -f .github/workflows/bootstrap-metal4-phase1-usable.yml
          rmdir .github/bootstrap 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(metal4): execute Vulkan transfer submissions"
          git push origin HEAD:metal4/phase1-command-backend-poc
