name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize-metal4-device-concurrency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shader-library-repository-phase1
          fetch-depth: 0
      - name: Use device-selected Metal 4 compiler width
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply-metal4-device-concurrency.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          git diff --check
          git rm -f Scripts/apply-metal4-device-concurrency.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/CI.yml
          git commit -m "perf(metal4): use device compiler concurrency"
          git push origin HEAD:codex/shared-shader-library-repository-phase1

  shared_shader_repository_policy:
    name: Metal 4 shared shader repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ownership, cache-view, memory, and reclaim invariants
        run: python3 Scripts/test-metal4-shared-shader-repository.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-26"]
        platform: ["macos", "ios"]
        upload_artifacts: [true]
        select_xcode: [false]
        private_api: [false]
        include:
          - os: "macos-26"
            platform: "macos"
            upload_artifacts: true
            select_xcode: false
            private_api: true
          - os: "macos-26"
            platform: "ios"
            upload_artifacts: true
            select_xcode: false
            private_api: true

    name: MoltenVK (Xcode ${{ matrix.xcode }} - ${{ matrix.platform }}${{ matrix.private_api && '-privateapi' || '' }})
    runs-on: ${{ matrix.os }}

    env:
      XCODE_DEV_PATH: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
      ARTIFACT_TYPE: ${{ matrix.platform }}${{ matrix.private_api && '-privateapi' || '' }}
      BUILD_ARGUMENTS: ${{ matrix.platform }} ${{ matrix.private_api && 'MVK_USE_METAL_PRIVATE_API=1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode version
        if: matrix.select_xcode == true
        run: sudo xcode-select -switch "${XCODE_DEV_PATH}"

      - name: Prep
        id: prep
        run: |
          XCODE_VERSION="$(xcodebuild -version)"
          echo "${XCODE_VERSION}"
          XCODE_VERSION="$(echo "${XCODE_VERSION}" | tr '\t\r\n ' '_')"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Dependencies
        id: cache-dependencies
        if: success() && !(github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        uses: actions/cache@v3
        with:
          path: |
            External/build
            !External/build/Intermediates
          key: ${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('fetchDependencies','ExternalRevisions/**','ExternalDependencies.xcodeproj/**','Scripts/**') }}

      - name: Fetch Dependencies (Use Built Cache)
        if: steps.cache-dependencies.outputs.cache-hit == 'true'
        run: ./fetchDependencies -v --none

      - name: Fetch Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: ./fetchDependencies -v --${{ matrix.platform }}

      - name: Output Dependency Build Logs on Failure
        if: failure()
        run: cat dependenciesbuild.log

      - name: Build MoltenVK
        run: make ${BUILD_ARGUMENTS}

      - name: Output MoltenVK Build Logs on Failure
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            cat xcodebuild.log
          fi

      - name: Tar Artifacts
        if: success() && matrix.upload_artifacts == true
        run: |
          rm -rf Package/Release/MoltenVKShaderConverter
          tar -C Package -s/Release/MoltenVK/ -cvf "MoltenVK-${ARTIFACT_TYPE}.tar" Release/

      - name: Upload Artifacts
        if: success() && matrix.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: "MoltenVK-${{ env.ARTIFACT_TYPE }}"
          path: "MoltenVK-${{ env.ARTIFACT_TYPE }}.tar"

  build_cmake:
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]
        config: [Debug, Release]

    name: MoltenVK (CMake - ${{ matrix.config }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          brew install ccache
          echo 'CACHE_PATH=~/Library/Caches/ccache' >> "$GITHUB_ENV"

      - uses: SimenB/github-actions-cpu-cores@v2.0.0
        id: cpu-cores

      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ matrix.config }}-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V
          ccache --show-config
          ccache --show-stats
          ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          artifacts: "MoltenVK*/*"
          artifactErrorsFailBuild: true
