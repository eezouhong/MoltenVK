name: Apply Metal 4 Probe Guard Fix

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/bootstrap-metal4-probe-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate
        run: |
          set -euo pipefail
          echo "86eba50fdc0345e5670da815dfb07123e89db607971b8239e0cb7c5f141eb9f2  .github/bootstrap/metal4-probe-guard.patch" | sha256sum --check
          git apply --check .github/bootstrap/metal4-probe-guard.patch
          git apply --index .github/bootstrap/metal4-probe-guard.patch
          python3 Scripts/test-metal4-command-backend-phase1.py
          git diff --cached --check
      - name: Commit source-only fix
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/metal4-probe-guard.patch
          rmdir .github/bootstrap 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): declare probe allocator guard"
          git push origin HEAD:metal4/phase1-command-backend-poc
