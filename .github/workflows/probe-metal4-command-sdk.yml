name: Probe Metal 4 command SDK

on:
  push:
    branches:
      - metal4/sdk-command-probe

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Print exact SDK command signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/Metal.framework/Headers"
          echo "SDK=$SDK"
          xcodebuild -version

          print_range() {
            local file="$1"
            local range="$2"
            echo "===== $file $range ====="
            sed -n "$range" "$H/$file"
          }

          print_range MTL4CommandAllocator.h '1,220p'
          print_range MTL4CommandQueue.h '45,365p'
          print_range MTL4CommitFeedback.h '1,220p'
          print_range MTL4CommandBuffer.h '25,225p'
          print_range MTL4CommandEncoder.h '1,145p'
          print_range MTL4ComputeCommandEncoder.h '300,485p'
          print_range MTL4ComputeCommandEncoder.h '550,590p'
          print_range MTL4ArgumentTable.h '1,155p'
          print_range MTLDevice.h '1420,1580p'
