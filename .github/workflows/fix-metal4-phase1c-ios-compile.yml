name: Fix Metal 4 Phase 1C iOS compile errors

on:
  push:
    branches:
      - metal4/phase1-command-backend-poc
    paths:
      - ".github/workflows/fix-metal4-phase1c-ios-compile.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metal4/phase1-command-backend-poc
          persist-credentials: true

      - name: Apply exact compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("MoltenVK/MoltenVK/GPUObjects/MVKQueue.mm")
          source = path.read_text()
          replacements = {
              "mvKVkExtent3DsAreEqual": "mvkVkExtent3DsAreEqual",
              "mvKMTLOriginFromVkOffset3D": "mvkMTLOriginFromVkOffset3D",
              "mvKMetal4StagesFromVkPipelineStages": "mvkMetal4StagesFromVkPipelineStages",
              "addPerformanceInterval(queue->getPerformanceStats().queue.mtlCommandBufferExecution, startTime);":
                  "queue->addPerformanceInterval(queue->getPerformanceStats().queue.mtlCommandBufferExecution, startTime);",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {old!r}, found {count}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Validate source contracts
        run: |
          python3 Scripts/test-metal4-base-cache-policy.py
          python3 Scripts/test-metal4-flexible-pipeline.py
          python3 Scripts/test-metal4-command-backend-phase1.py
          bash -n Tests/Metal4CommandBackend/run-macos.sh
          git diff --check

      - name: Commit fixes
        run: |
          rm .github/workflows/fix-metal4-phase1c-ios-compile.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(metal4): resolve Phase 1C iOS compile errors"
          git push origin HEAD:metal4/phase1-command-backend-poc
